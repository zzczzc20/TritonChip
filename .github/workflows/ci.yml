# The per-push check.
#
# This is a SUBSET and says so. The acceptance gate is
# `.github/workflows/r1-acceptance.yml`: two independent environments, the
# whole matrix, the mutation suite, the evidence verifier. That takes hours,
# which is the wrong shape for a pull request, so it runs on a schedule and on
# demand instead.
#
# What belongs here is everything that is fast AND can fail: elaboration, the
# unit benches, the single-core programs under three memory models and on the
# board's register file, the four-tile machine with its NUCA slices, mesh and
# DCO policies, the generated FMA at both latencies, the compiler with its IR tests,
# the R1 resource and profile checks, the R2 schema contracts, the R3.7
# TileBench gate with R38's cycle and artifact identity, the PyTorch/Inductor
# path and ArchBench's compile coverage, and the gate's own self-test. A green
# tick here means those passed. It does not mean R1 is accepted, and nothing
# in this file claims otherwise.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_PREFIX: /usr/lib/llvm-20
  TNCA_LLVM: /usr/lib/llvm-20

jobs:
  check:
    name: "lint, unit, core, system, compiler"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iverilog yosys build-essential cmake ninja-build \
            python3 python3-venv \
            libmlir-20-dev mlir-20-tools llvm-20-dev
          iverilog -V | head -1
          make --version | head -1

      - name: Report the toolchain against the lock
        run: make r1-doctor

      # The generated sources must still follow from their inputs. rtl/gen is
      # reported as not re-checked here: regenerating it needs the pinned XLS
      # release, which the acceptance workflow fetches and this one does not.
      - name: Generated sources match their inputs
        run: make r1-check-generated

      - name: The frozen inventories are well formed
        run: |
          make r1-inventory
          make r2-inventory

      - name: Elaboration
        run: make lint

      - name: R40 bounded global dispatcher and real cores
        run: |
          make r40-grid-dispatch
          make r40-coherent-host
          make r40-multicore-shell

      - name: Unit benches
        run: make unit

      # The binary32 FMA is generated (xls/tnca_fma.x); the checked-in
      # instances at both latencies against the exact oracle, half a million
      # vectors each.
      - name: The generated FMA, deep
        run: make fma-deep

      - name: Single-core programs, three memory models
        run: |
          make core
          make core-slowmem
          make core-ooo

      - name: The four-tile machine
        run: make top

      # The last level on its own: the NUCA slice under three memory models,
      # the mesh, and the same randomised slice check under DCO's
      # replacement, bypass and dead-block policies (doc/dco.md) -- where
      # every read must still return the shadow memory's value.
      - name: NUCA slice, mesh and DCO policies
        run: |
          make nuca
          make mesh
          make nuca-dco

      # What the board runs: every core program on the banked, synchronous
      # register file (core-vrf-sync-v1, the U280 image), and the transposed
      # tensor transfer of core-xpose-v1.
      - name: The board's elaboration and the transposed transfer
        run: |
          make core-vrf
          make r38-xpose-rtl
          python3 tools/r40/tensor_bounds_tests.py

      # R38's counter list is generated in three places and must agree; the
      # evidence registry must reject each of its injected mutations.
      - name: R38 counters and evidence registry
        run: |
          python3 tools/r38/gen_counters.py --check
          python3 tools/r38/evidence_tests.py

      - name: Build tnca-opt against the distribution MLIR
        run: make tnca-opt

      - name: Compiler and its IR tests
        run: make compiler

      - name: R1 resource, footprint and ownership checks
        run: python3 tools/r1/resource_tests.py

      # CFG-01 reads capabilities back from every profile's own bench, and
      # `core-vrf-sync-v1` and `core-xpose-v1` are profiles like any other --
      # so their benches have to exist here (the Makefile's r1-profile-tests
      # builds the same set). Only the benches are built: the programs that
      # run on them are other targets' business, not this job's.
      - name: R1 profile and capability checks
        run: make r1-profile-tests

      # R3's performance model: six graphs whose cycle counts are worked out
      # by hand in the test, and exact agreement required. No RTL, no
      # simulator, under a second.
      - name: R3 performance model
        run: make r3-model-tests

      # R3's budgets and caps, checked without starting anything.
      - name: R3 plan
        run: make r3-plan

      # R3-03 and R3-04: the banked register file against an independent
      # model, and the operand collector against the real file. Both are
      # iverilog only -- no Triton, no device -- and both pass every case
      # they claim, so they belong in the per-push run.
      #
      # r3-flow-tests is NOT here. FLOW-03 is honestly NOT RUN (it needs
      # the writeback units of R3-05) and the suite exits non-zero because
      # of it, which is the behaviour R1-02 asks for. Making it green would
      # mean turning a missing case into a skip.
      - name: R3 banked register file
        run: make r3-rf-tests

      # R3-10: structural synthesis that keeps the memories, so a register
      # file is counted as storage rather than as a few hundred thousand
      # flops. About three minutes, and it passes identically on the yosys
      # Ubuntu ships (0.33) and a current one (0.52) -- checked, because a
      # synthesis result that depends on the tool version is not a property
      # of the design.
      - name: R3 storage synthesis
        run: make r3-synth-tests

      # The gate has to be able to fail. Ten injected faults, each of which
      # must be detected; this is cheap and is the check that keeps every
      # other green tick meaningful.
      - name: The gate can fail
        run: make r1-gate-selftest

  triton:
    name: "the real Triton frontend"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iverilog yosys build-essential cmake ninja-build \
            python3 python3-venv \
            libmlir-20-dev mlir-20-tools llvm-20-dev

      - name: Cache the wheel download
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('spec/r1_toolchain.lock.json') }}

      # The version comes from the lock, not from this file. 3.5.0 installs
      # and imports and has no `get_constant_value`, so "some Triton" is not
      # the same claim as "the locked Triton".
      - name: Install locked Triton, Torch and the tutorial plugin
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('spec/r1_toolchain.lock.json'))['triton']['version'])")
          PV=$(python3 -c "import json;print(json.load(open('spec/r38/torch.lock.json'))['version'])")
          python3 -m venv ~/tritonenv
          ~/tritonenv/bin/pip install -q "triton==$V" "torch==$PV" numpy
          make python/tnca/data/.staged
          ~/tritonenv/bin/pip install -q -e .
          ~/tritonenv/bin/python -c "import torch, triton;print('torch', torch.__version__, 'triton', triton.__version__)"

      - name: Build what the end-to-end tests run on
        run: |
          make tnca-opt
          make sim/build/tb_core.vvp sim/build/tb_top.vvp

      - name: R40 compile option identity and explicit overrides
        run: |
          python3 tools/r40/packed_window_options_tests.py
          $HOME/tritonenv/bin/python tools/r40/compile_switch_tests.py
          $HOME/tritonenv/bin/python tools/r40/pipeline_stage_options_tests.py
          python3 tools/r40/child_exec_tests.py
          python3 tools/r40/proton_tests.py
          python3 tools/performance_harness/tests.py
          $HOME/tritonenv/bin/python tools/r40/proton_upstream_tests.py

      - name: Triton source to RTL, one core and the whole machine
        run: |
          make triton-e2e TRITON_PYTHON=$HOME/tritonenv/bin/python
          make e2e TRITON_PYTHON=$HOME/tritonenv/bin/python

      - name: The IR support boundary
        run: TRITON_PYTHON=$HOME/tritonenv/bin/python python3 tools/r1/ir_tests.py

      # DCO's compiler pass: nAcc, bypass and tile granule for three kernels
      # whose read counts are known, and the refusal of one it cannot count.
      - name: DCO compiler pass
        run: make dco-compiler TRITON_PYTHON=$HOME/tritonenv/bin/python R1_STRICT=1

      # R2's compile driver, through its public entry point: three real
      # Triton kernels compiled and executed, and one artifact run with three
      # different alphas at two different addresses.
      # The argument ABI against an independent byte-level oracle, and the
      # manifest, container and loader. Both suites have schema cases that
      # need nothing and device cases that need a simulator.
      - name: R2 ABI and artifact
        run: |
          make r2-abi-tests TRITON_PYTHON=$HOME/tritonenv/bin/python
          make r2-artifact-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      - name: R2 compile driver
        run: make r2-compile-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # One compile, four cache hits, and the compiler counted rather than
      # timed: "it was fast" and "it did not happen" are different claims.
      - name: R2 compile cache
        run: make r2-cache-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # The IR and assembly dumps, and mostly that they are a view rather
      # than an influence: a dump must not change the cache key or the
      # artifact, or turning one on hands you a different kernel than the
      # one you were trying to look at.
      - name: R2 IR and assembly dumps
        run: make r2-dump-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # The persistent device: 32 launches in one session, eight tasks held
      # and a ninth refused, and an A->B->C chain whose middle result never
      # leaves the device.
      - name: R2 runtime session
        run: make r2-runtime-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # Faults, drain and recovery: a trapping kernel is FAILED and the
      # session still works afterwards.
      - name: R2 faults and recovery
        run: make r2-fault-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # The tutorial's examples, which is the only way its pages stay true.
      # Each one computes its expected answer in Python and exits non-zero
      # when the device disagrees, so a compiler change that breaks a
      # documented result breaks this instead of quietly making the docs
      # wrong.
      - name: The tutorial's examples
        run: make tutorial TRITON_PYTHON=$HOME/tritonenv/bin/python R1_STRICT=1

      # R3.6's fast checkers. The backend registry and the configuration
      # rules cost seconds, and both watch things a routine change can
      # break without any other suite noticing: a backend that falls back
      # to the simulator, or a compile target that drifts from the RTL it
      # claims to describe.
      #
      # The heavy ones -- the memory boundary, the mutations, the frozen
      # regression and the downstream rehearsal -- are NOT here. They run
      # in the gate, where a long run is the point.
      - name: R3.6 backend boundary and configuration
        run: |
          make r36-check-plan TRITON_PYTHON=$HOME/tritonenv/bin/python
          make r36-backend-tests TRITON_PYTHON=$HOME/tritonenv/bin/python
          make r36-config-tests TRITON_PYTHON=$HOME/tritonenv/bin/python

      # The hardware export, built and then proved from somewhere else
      # entirely: elaborated with no library search of ours and run
      # against a program whose answer it checks itself.
      - name: The hardware export, on its own
        run: |
          make r36-export
          make r36-rtl-tests

      # NOTE: `make r2-grid-tests` is deliberately NOT here. GRID-03, -04,
      # -05 and -07 are about per-tile launch on the four-tile machine and
      # are honestly NOT RUN, so the suite exits non-zero -- which is the
      # right behaviour and the wrong signal for a per-push check. It runs in
      # the acceptance workflow, where a NOT RUN case is supposed to fail the
      # gate. Making it pass here would mean turning a missing case into a
      # skip, which is the thing R1-02 exists to prevent.

      # The installable wheel, and the claim that matters: an environment
      # with no Triton and no compiler loads an artifact and runs it.
      - name: R2 package
        run: |
          set -euo pipefail
          make r2-package PYTHON=$HOME/tritonenv/bin/python
          $HOME/tritonenv/bin/python tools/r2/wheel_smoke.py
          python3 -m venv ~/runtime-only
          ~/runtime-only/bin/pip install -q sim/build/dist/*.whl
          ~/runtime-only/bin/python -c "import triton" 2>&1 | tail -1 || true
          ~/runtime-only/bin/tnca-aot doctor
          ~/runtime-only/bin/tnca-sim prepare

  tilebench:
    name: "original TileBench, AOT O${{ matrix.opt_level }}"
    runs-on: ubuntu-24.04
    # O2 also runs R38's cycle baseline (two more O2 passes) and O1 the
    # profiler, so the longest of the three is about three times the gate.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        opt_level: [0, 1, 2]
    steps:
      # Full history: the profiler's case 6 builds the device as it was
      # before the counters (`git show 3b5b28f:...`), which a shallow
      # checkout does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the validated TileBench sources
        uses: actions/checkout@v4
        with:
          repository: Deep-Learning-Profiling-Tools/Tilebench
          ref: 6e2cf155dfe01f4660540d187c81b09eb55f394f
          path: sim/build/Tilebench
          persist-credentials: false
      - name: Install the simulator and locked Triton
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog python3-venv
          V=$(python3 -c "import json;print(json.load(open('spec/r1_toolchain.lock.json'))['triton']['version'])")
          python3 -m venv ~/tritonenv
          ~/tritonenv/bin/pip install -q "triton==$V"
      - name: AOT descriptor and scratch contracts
        if: matrix.opt_level == 2
        run: make r37-aot-tests TRITON_PYTHON=$HOME/tritonenv/bin/python
      - name: Original kernels through AOT and Session
        run: make r37-run TRITON_PYTHON=$HOME/tritonenv/bin/python TILEBENCH_SOURCE=sim/build/Tilebench R37_OPT_LEVELS=${{ matrix.opt_level }}
      # Keep all 149 R38 cycle values exact, twice. B39 added the truthful
      # tensor-store capability and RCTX flags, so R40 pins B39's profile
      # hash explicitly while preserving the historical R38 reference.
      - name: Frozen B39 core-sim cycle contract
        if: matrix.opt_level == 2
        run: make r40-baseline-check TRITON_PYTHON=$HOME/tritonenv/bin/python TILEBENCH_SOURCE=sim/build/Tilebench
      # The profiler's attribution against the counters and the cost model.
      - name: R38 profiler
        if: matrix.opt_level == 1
        run: make r38-profiler TRITON_PYTHON=$HOME/tritonenv/bin/python TILEBENCH_SOURCE=sim/build/Tilebench
      - name: Preserve numerical validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r37-aot-O${{ matrix.opt_level }}
          path: |
            sim/build/r37_aot_run.json
            sim/build/r37_aot_run_artifacts/
            sim/build/r38/baseline_check_*.json

  # The PyTorch path: torch.compile -> Inductor -> Triton -> the TNCA plugin
  # -> the RTL simulator, in the locked torch (spec/r38/torch.lock.json), in
  # its own environment so no other job gains a dependency.
  torch:
    name: "PyTorch: ${{ matrix.suite }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite: [plugin, inductor]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the validated TileBench sources
        uses: actions/checkout@v4
        with:
          repository: Deep-Learning-Profiling-Tools/Tilebench
          ref: 6e2cf155dfe01f4660540d187c81b09eb55f394f
          path: sim/build/Tilebench
          persist-credentials: false
      - name: Cache the wheel download
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-torch-${{ hashFiles('spec/r38/torch.lock.json', 'spec/r1_toolchain.lock.json') }}
      # torch and triton at their locked versions; the plugin is the package
      # itself, installed so that Triton finds its `triton.backends` entry
      # point.
      - name: Install the simulator, locked torch and the TNCA plugin
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog python3-venv
          TV=$(python3 -c "import json;print(json.load(open('spec/r1_toolchain.lock.json'))['triton']['version'])")
          PV=$(python3 -c "import json;print(json.load(open('spec/r38/torch.lock.json'))['version'])")
          python3 -m venv ~/torchenv
          ~/torchenv/bin/pip install -q "torch==$PV" "triton==$TV" numpy
          make python/tnca/data/.staged
          ~/torchenv/bin/pip install -q -e .
          ~/torchenv/bin/python -c "import torch, triton, tnca; print('torch', torch.__version__, 'triton', triton.__version__)"
          # A launch never builds the simulator it runs on (that would put an
          # iverilog compile inside a kernel call), so build it once here.
          ~/torchenv/bin/tnca-sim prepare
      # The plugin: its artifacts byte-identical to the AOT driver's at O0-O2,
      # TileBench's kernels launched natively with `kernel[grid](...)`, and
      # the Inductor graphs (with fallback detection).
      - name: Triton plugin and Inductor graphs
        if: matrix.suite == 'plugin'
        run: |
          make r38-torch TORCH_PYTHON=$HOME/torchenv/bin/python \
            TRITON_PYTHON=$HOME/torchenv/bin/python TILEBENCH_SOURCE=sim/build/Tilebench
      # Tensor descriptors of rank 1-5 through Triton's NVIDIA-style API, on
      # the RTL, element for element against PyTorch; then every ArchBench
      # tiny and small point compiled for TNCA (nothing simulated), and the
      # benchmark's own scoring self-test.
      - name: Tensor descriptors, ArchBench coverage and self-test
        if: matrix.suite == 'inductor'
        run: |
          make r38-tdesc TORCH_PYTHON=$HOME/torchenv/bin/python
          make archbench-selftest TORCH_PYTHON=$HOME/torchenv/bin/python
          make archbench-coverage TORCH_PYTHON=$HOME/torchenv/bin/python ARCHBENCH_JOBS=4
      - name: Preserve the coverage record
        if: always() && matrix.suite == 'inductor'
        uses: actions/upload-artifact@v4
        with:
          name: archbench-coverage
          path: sim/build/archbench/coverage.jsonl
          if-no-files-found: ignore

  # These real multicore RTL sweeps exceeded the frontend job's two-hour
  # observation budget. Keep every target, isolate their failures, and run
  # independent suites concurrently; device deadlines and workloads stay fixed.
  r40-grid:
    name: "R40 grid and pipeline (${{ matrix.suite }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [transport, native, chunks, memory, pipeline]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iverilog yosys build-essential cmake ninja-build python3 python3-venv \
            libmlir-20-dev mlir-20-tools llvm-20-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('spec/r1_toolchain.lock.json') }}
      - name: Locked Torch, Triton and plugin
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('spec/r1_toolchain.lock.json'))['triton']['version'])")
          PV=$(python3 -c "import json;print(json.load(open('spec/r38/torch.lock.json'))['version'])")
          python3 -m venv ~/tritonenv
          ~/tritonenv/bin/pip install -q "triton==$V" "torch==$PV" numpy
          make python/tnca/data/.staged
          ~/tritonenv/bin/pip install -q -e .
          make tnca-opt
      - name: Mailbox and runtime protocol
        if: matrix.suite == 'transport'
        run: |
          make r40-physical-grid-transport r40-physical-grid-runtime r40-multicore-backend \
            TRITON_PYTHON=$HOME/tritonenv/bin/python
      - name: Three and eight core native Torch
        if: matrix.suite == 'native'
        run: make r40-multicore-native-smoke TRITON_PYTHON=$HOME/tritonenv/bin/python
      - name: Bounded role chunks, descriptor and pair
        if: matrix.suite == 'chunks'
        run: make r40-physical-chunks TRITON_PYTHON=$HOME/tritonenv/bin/python
      - name: Multiple memory outlets and line AXI
        if: matrix.suite == 'memory'
        run: |
          make r40-memory-ports r40-line-axi r40-cache-maintenance r40-multicore-dma \
            TRITON_PYTHON=$HOME/tritonenv/bin/python TORCH_PYTHON=$HOME/tritonenv/bin/python
      - name: Two and three stage native pipelines and engine overlap
        if: matrix.suite == 'pipeline'
        run: |
          make r40-pipeline-checks TRITON_PYTHON=$HOME/tritonenv/bin/python \
            TORCH_PYTHON=$HOME/tritonenv/bin/python
      - name: Preserve pipeline trace and artifacts
        if: always() && matrix.suite == 'pipeline'
        uses: actions/upload-artifact@v4
        with:
          name: r40-pipeline-traces
          path: sim/build/r40/pipeline*
          if-no-files-found: ignore

  r40-mmio:
    name: "R40 multicore MMIO and native AXI graphs"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            iverilog yosys build-essential cmake ninja-build python3 python3-venv \
            libmlir-20-dev mlir-20-tools llvm-20-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('spec/r1_toolchain.lock.json') }}
      - name: Locked Torch, Triton and plugin
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('spec/r1_toolchain.lock.json'))['triton']['version'])")
          PV=$(python3 -c "import json;print(json.load(open('spec/r38/torch.lock.json'))['version'])")
          python3 -m venv ~/tritonenv
          ~/tritonenv/bin/pip install -q "triton==$V" "torch==$PV" numpy
          make python/tnca/data/.staged
          ~/tritonenv/bin/pip install -q -e .
          make tnca-opt
      - name: Real registers, AXI and resident Torch graphs
        run: make r40-multicore-mmio TRITON_PYTHON=$HOME/tritonenv/bin/python
